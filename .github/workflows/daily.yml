name: Daily men's football
on:
  schedule:
    - cron: '0 16 * * *'
      timezone: America/Los_Angeles
    - cron: '7,22,37,52 16-23 * * *'
      timezone: America/Los_Angeles
    - cron: '17 9,13 * * *'
      timezone: America/Los_Angeles
  workflow_dispatch:
    inputs:
      correction:
        description: 'Explicit corrected edition of a previously delivered report'
        type: boolean
        default: false
      report_date:
        description: 'Optional LA report day YYYY-MM-DD (blank = latest 16:00 cutoff)'
        required: false
        type: string
      partial_day:
        description: 'Manual preview before 16:00; only include completed matches as of run time'
        required: false
        default: false
        type: boolean
      require_complete_media:
        description: 'Manual only: hold initial email until media complete (scheduled runs send clearly marked gaps)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: football-daily
  cancel-in-progress: false
  queue: max

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url || steps.publish_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Lock report date and build timestamp
        env:
          RETRY_SCHEDULE: ${{ github.event_name == 'schedule' && github.event.schedule != '0 16 * * *' }}
          REQUESTED_DATE: ${{ inputs.report_date }}
          PREVIEW: ${{ inputs.partial_day }}
        run: |
          python - <<'PY'
          import datetime as dt, os
          from agent import LA
          from daily_delivery import load, next_scheduled_report
          now = dt.datetime.now(LA)
          requested = os.environ.get('REQUESTED_DATE')
          day = dt.date.fromisoformat(requested) if requested else now.date() - dt.timedelta(days=now.hour < 16)
          state = load()
          if os.environ.get('REQUESTED_DATE', '') == '' and os.environ.get('PREVIEW') != 'true':
              day, retry = next_scheduled_report(state, day)
          else:
              retry = os.environ.get('PREVIEW') != 'true' and state.get(str(day), {}).get('status') in ('pending', 'waiting')
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'REPORT_DATE={day}\nBUILD_STARTED={now.isoformat()}\nMEDIA_RETRY={str(retry).lower()}\n')
          if retry and day:
              import subprocess
              subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
              subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
              from daily_delivery import retry_attempt
              retry_attempt(day)
          PY
      - name: Install image export tools and Chinese font
        if: env.REPORT_DATE != ''
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify date, scope, and media safeguards
        if: env.REPORT_DATE != ''
        run: python -m unittest discover -s tests -v
      - name: Generate report
        if: env.REPORT_DATE != ''
        id: generate
        continue-on-error: true
        env:
          PARTIAL_DAY: ${{ inputs.partial_day }}
        run: |
          if [ "$MEDIA_RETRY" = 'true' ]; then
            python agent.py --date "$REPORT_DATE" --refresh-media
          elif [ "$PARTIAL_DAY" = 'true' ]; then
            python agent.py --date "$REPORT_DATE" --partial-day
          else
            python agent.py --date "$REPORT_DATE"
          fi
      - name: Preserve daily history
        if: env.REPORT_DATE != ''
        run: |
          python - <<'PY'
          import datetime as dt, json, os
          from pathlib import Path
          p = json.loads(Path(f'docs/reports/{os.environ["REPORT_DATE"]}.json').read_text())
          assert p['day'] == os.environ['REPORT_DATE']
          assert dt.datetime.fromisoformat(p['generated']) >= dt.datetime.fromisoformat(os.environ['BUILD_STARTED']), 'Stale report: refuse to publish or send success notification'
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ '${{ inputs.partial_day }}' = 'true' ]; then
            echo 'Manual preview is not published or emailed.'
            exit 0
          fi
          git add docs
          if [ -f data/player-name-cache.json ]; then git add data/player-name-cache.json; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Publish daily football report'
            git push
          fi
      - name: Queue delivery before Pages deployment
        if: env.REPORT_DATE != '' && inputs.partial_day != true
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORT_EMAIL: ${{ secrets.REPORT_EMAIL }}
          REQUIRE_COMPLETE_MEDIA: ${{ inputs.require_complete_media }}
        run: |
          if [ -n "$SMTP_USERNAME" ] && [ -n "$SMTP_PASSWORD" ] && [ -n "$REPORT_EMAIL" ]; then
            python -c "import os; from daily_delivery import waiting; waiting(os.environ['REPORT_DATE'], os.environ['REQUIRE_COMPLETE_MEDIA'] == 'true')"
          fi
      - name: Email PNG and ZIP attachments
        if: env.REPORT_DATE != '' && inputs.partial_day != true
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORT_EMAIL: ${{ secrets.REPORT_EMAIL }}
          REQUIRE_COMPLETE_MEDIA: ${{ inputs.require_complete_media }}
          CORRECTION: ${{ inputs.correction }}
        run: |
          if [ -n "$SMTP_USERNAME" ] && [ -n "$SMTP_PASSWORD" ] && [ -n "$REPORT_EMAIL" ]; then
            if [ "$CORRECTION" = 'true' ]; then
              python mail_report.py --date "$REPORT_DATE" --correction
            else
              python mail_report.py --date "$REPORT_DATE"
            fi
          else
            echo '::notice::Attachment email is awaiting Gmail authorization. GitHub notification remains active.'
          fi
      - uses: actions/upload-pages-artifact@v3
        if: env.REPORT_DATE != '' && inputs.partial_day != true
        with:
          path: docs
          retention-days: 1
      - name: Wait for uploaded artifact to become visible to Pages
        if: env.REPORT_DATE != '' && inputs.partial_day != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          url = f'https://api.github.com/repos/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}/artifacts'
          for attempt in range(12):
              req = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'User-Agent': 'FootballDaily'})
              with urllib.request.urlopen(req, timeout=20) as response:
                  artifacts = json.load(response)['artifacts']
              if any(a['name'] == 'github-pages' for a in artifacts):
                  break
              time.sleep(5)
          else:
              raise RuntimeError('Pages artifact not available after upload')
          PY
      - name: Publish report
        if: env.REPORT_DATE != '' && inputs.partial_day != true
        id: publish
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Allow Pages artifact listing to settle before retry
        if: env.REPORT_DATE != '' && steps.publish.outcome == 'failure'
        run: sleep 15
      - name: Retry transient Pages deployment failure once
        if: env.REPORT_DATE != '' && steps.publish.outcome == 'failure'
        id: publish_retry
        uses: actions/deploy-pages@v4
      - name: Notify personal account after publishing
        if: env.REPORT_DATE != '' && env.MEDIA_RETRY != 'true' && inputs.partial_day != true
        env:
          GH_TOKEN: ${{ github.token }}
          PAGE_URL: ${{ steps.publish.outputs.page_url || steps.publish_retry.outputs.page_url }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORT_EMAIL: ${{ secrets.REPORT_EMAIL }}
        run: |
          if [ -z "$SMTP_USERNAME" ] || [ -z "$SMTP_PASSWORD" ] || [ -z "$REPORT_EMAIL" ]; then
            python notify.py
          else
            echo 'Attachment email enabled; skipping duplicate GitHub notification.'
          fi
      - name: Surface pending or exhausted media retries
        if: env.REPORT_DATE != '' && inputs.partial_day != true
        run: |
          python - <<'PY'
          import os
          from daily_delivery import load, MAX_RETRIES
          entry = load().get(os.environ['REPORT_DATE'], {})
          if entry.get('status') in ('pending', 'waiting'):
              attempts = entry.get('attempts', 0)
              print(f'::warning::Report delivery pending; media retry attempts {attempts}/{MAX_RETRIES}')
              if attempts >= MAX_RETRIES:
                  raise SystemExit('Media retry budget exhausted; review pending report and rerun manually')
          PY
      - name: Surface incomplete data as a failed check
        if: env.REPORT_DATE != '' && steps.generate.outcome == 'failure'
        run: |
          echo 'Report published with explicit data gaps. See report and owner notification.'
          exit 1
