name: Daily men's football
on:
  schedule:
    - cron: '0 16 * * *'
      timezone: America/Los_Angeles
  workflow_dispatch:
    inputs:
      report_date:
        description: 'Optional LA report day YYYY-MM-DD (blank = latest 16:00 cutoff)'
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: football-daily
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify date, scope, and media safeguards
        run: python -m unittest discover -s tests -v
      - name: Lock report date and build timestamp
        env:
          REQUESTED_DATE: ${{ inputs.report_date }}
        run: |
          python - <<'PY'
          import datetime as dt, os
          from agent import LA
          now = dt.datetime.now(LA)
          requested = os.environ.get('REQUESTED_DATE')
          day = dt.date.fromisoformat(requested) if requested else now.date() - dt.timedelta(days=now.hour < 16)
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'REPORT_DATE={day}\nBUILD_STARTED={now.isoformat()}\n')
          PY
      - name: Generate report
        id: generate
        continue-on-error: true
        run: |
          python agent.py --date "$REPORT_DATE"
      - name: Preserve daily history
        run: |
          python - <<'PY'
          import datetime as dt, json, os
          from pathlib import Path
          p = json.loads(Path(f'docs/reports/{os.environ["REPORT_DATE"]}.json').read_text())
          assert p['day'] == os.environ['REPORT_DATE']
          assert dt.datetime.fromisoformat(p['generated']) >= dt.datetime.fromisoformat(os.environ['BUILD_STARTED']), 'Stale report: refuse to publish or send success notification'
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs
          if ! git diff --cached --quiet; then
            git commit -m 'Publish daily football report'
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
          retention-days: 1
      - name: Publish report
        id: publish
        uses: actions/deploy-pages@v4
      - name: Notify personal account after publishing
        env:
          GH_TOKEN: ${{ github.token }}
          PAGE_URL: ${{ steps.publish.outputs.page_url }}
        run: python notify.py
      - name: Surface incomplete data as a failed check
        if: steps.generate.outcome == 'failure'
        run: |
          echo 'Report published with explicit data gaps. See report and owner notification.'
          exit 1
